<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>应用锁控制中心</title>
<style>
:root{font-family:Segoe UI,Microsoft YaHei,sans-serif;color:#172033;background:#f5f7fb;--blue:#3767f5;--line:#e5eaf2;--muted:#77849a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 0,#e5edff,transparent 34%),#f7f8fb}.wrap{max-width:1050px;margin:auto;padding:32px 20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:13px;background:#172033;color:#fff;display:grid;place-items:center}.logo svg{width:22px}.brand h1{font-size:20px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:3px 0}.status{background:#fff;border:1px solid var(--line);border-radius:20px;padding:9px 14px;font-size:12px;color:#647188}.status i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#24b47e;margin-right:7px;box-shadow:0 0 0 4px #e2f7ee}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:0 12px 30px #243b6710;animation:in .4s ease both}.card+ .card{margin-top:18px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.title{font-size:15px;font-weight:700}.btn{border:0;border-radius:10px;padding:9px 13px;font-size:12px;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-1px)}.primary{background:var(--blue);color:#fff}.quiet{background:#f1f4f9;color:#526078}.danger{background:#fff0f2;color:#cf4c59}.apps{display:grid;gap:10px}.app{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:13px;padding:12px;transition:.2s}.app:hover{transform:translateY(-2px);border-color:#b9caff;box-shadow:0 8px 20px #3767f514}.icon{width:37px;height:37px;border-radius:11px;background:#edf2ff;color:var(--blue);display:grid;place-items:center;font-weight:700}.info{flex:1;min-width:0}.name{font-size:14px;font-weight:650}.path{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}.actions{display:flex;gap:8px;align-items:center}.switch{position:relative;width:39px;height:22px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#d7deea;border-radius:20px;transition:.2s}.slider:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:#24b47e}.switch input:checked+.slider:before{transform:translateX(17px)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f7f9fd;border-radius:13px;padding:15px}.num{font-size:27px;font-weight:750}.label{font-size:11px;color:var(--muted);margin-top:4px}.row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row b{font-size:13px}.row small{display:block;color:var(--muted);margin-top:4px}.logs{max-height:160px;overflow:auto}.log{font-size:12px;color:#58667c;padding:9px 0;border-bottom:1px solid #f0f2f6}.log time{color:#a0aabd;margin-right:9px}.empty{text-align:center;color:var(--muted);padding:30px;font-size:13px}.modal{display:none;position:fixed;inset:0;background:#17203366;backdrop-filter:blur(5px);place-items:center}.dialog{width:min(410px,calc(100% - 30px));background:#fff;padding:22px;border-radius:17px}.dialog h2{font-size:17px;margin:0 0 16px}.field{margin:11px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}@keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@media(max-width:720px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:12px;flex-direction:column}}
</style></head><body><main class="wrap"><header class="top"><div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 19 6v5c0 5-3 8-7 10-4-2-7-5-7-10V6l7-3Z"/><path d="m9 12 2 2 4-4"/></svg></div><div><h1>应用锁控制中心</h1><p>Windows Hello 隐私防护</p></div></div><div class="status"><i></i><span id="status">连接中</span></div></header><section class="grid"><div><article class="card"><div class="head"><div class="title">受保护的应用</div><button class="btn primary" id="add">添加应用</button></div><div class="apps" id="apps"></div></article><article class="card"><div class="head"><div class="title">活动记录</div><button class="btn quiet" id="clear">清空</button></div><div class="logs" id="logs"></div></article></div><aside><article class="card"><div class="head"><div class="title">运行概览</div></div><div class="stats"><div class="stat"><div class="num" id="total">0</div><div class="label">应用总数</div></div><div class="stat"><div class="num" id="locked">0</div><div class="label">已启用保护</div></div></div></article><article class="card"><div class="head"><div class="title">系统设置</div></div><div class="row"><div><b>Windows Hello</b><small id="hello">检测中</small></div><button class="btn quiet" id="check">检测</button></div><div class="row"><div><b>配置文件</b><small>修改后自动生效</small></div><button class="btn quiet" id="reload">刷新</button></div><div class="row"><div><b>锁定核心</b><small>重新载入保护进程</small></div><button class="btn quiet" id="restart">重启</button></div><div class="row"><div><b>退出服务</b><small>恢复窗口后退出</small></div><button class="btn danger" id="shutdown">关闭</button></div></article></aside></section></main><div class="modal" id="modal"><div class="dialog"><h2>添加受保护应用</h2><div class="field"><label>名称</label><input id="name" placeholder="例如：微信"></div><div class="field"><label>可执行文件路径</label><input id="path" placeholder="C:\\Program Files\\App\\App.exe"></div><div class="foot"><button class="btn quiet" id="cancel">取消</button><button class="btn primary" id="save">保存</button></div></div></div>
<script>const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let apps=[];function log(x){$('#logs').insertAdjacentHTML('afterbegin',`<div class="log"><time>${new Date().toLocaleTimeString('zh-CN',{hour12:false})}</time>${esc(x)}</div>`)}async function api(u,o){let r=await fetch(u,o);if(!r.ok)throw Error((await r.json().catch(()=>({}))).error||`请求失败 ${r.status}`);return r.json()}function render(){let b=$('#apps');$('#total').textContent=apps.length;$('#locked').textContent=apps.filter(a=>a.locked).length;if(!apps.length){b.innerHTML='<div class="empty">还没有受保护的应用</div>';return}b.innerHTML=apps.map(a=>`<div class="app"><div class="icon">${esc((a.name||'?')[0].toUpperCase())}</div><div class="info"><div class="name">${esc(a.name)}</div><div class="path">${esc(a.path||a.process)}</div></div><div class="actions"><label class="switch"><input type="checkbox" data-id="${a.id}" ${a.locked?'checked':''}><span class="slider"></span></label><button class="btn quiet remove" data-id="${a.id}">移除</button></div></div>`).join('');b.querySelectorAll('input').forEach(x=>x.onchange=async()=>{try{await api('/api/apps/'+x.dataset.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({locked:x.checked})});apps.find(a=>a.id==x.dataset.id).locked=x.checked;render();log(x.checked?'已启用保护':'已暂停保护')}catch(e){x.checked=!x.checked;log(e.message)}});b.querySelectorAll('.remove').forEach(x=>x.onclick=async()=>{if(!confirm('移除这个应用的保护？'))return;await api('/api/apps/'+x.dataset.id,{method:'DELETE'});apps=apps.filter(a=>a.id!=x.dataset.id);render();log('已移除应用')})}async function load(){try{apps=await api('/api/apps');render();let s=await api('/api/status');$('#status').textContent=s.coreRunning?'实时保护':'核心未运行';log('配置已同步')}catch(e){$('#status').textContent='连接失败';log(e.message)}}async function hello(){try{$('#hello').textContent=(await api('/api/hello-status')).message}catch(e){$('#hello').textContent='检测失败'}}$('#add').onclick=()=>$('#modal').style.display='grid';$('#cancel').onclick=()=>$('#modal').style.display='none';$('#save').onclick=async()=>{let n=$('#name').value.trim(),p=$('#path').value.trim();if(!n||!p)return log('请填写名称和路径');try{let a=await api('/api/apps',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,path:p,locked:true})});apps.push(a);render();$('#modal').style.display='none';log('已添加应用')}catch(e){log(e.message)}};$('#reload').onclick=load;$('#check').onclick=hello;$('#clear').onclick=()=>$('#logs').innerHTML='';$('#restart').onclick=async()=>{try{await api('/api/restart',{method:'POST'});log('锁定核心已重启');load()}catch(e){log(e.message)}};$('#shutdown').onclick=async()=>{if(!confirm('关闭应用锁服务？'))return;try{await api('/api/shutdown',{method:'POST'});$('#status').textContent='已关闭'}catch(e){log(e.message)}};load();hello();setInterval(()=>api('/api/status').then(s=>$('#status').textContent=s.coreRunning?'实时保护':'核心未运行').catch(()=>$('#status').textContent='连接失败'),5000);</script></body></html>
